<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>Paperclip عربي</title>
<style>
  :root { color-scheme: dark; font-family: Tahoma, 'Segoe UI', sans-serif; }
  body { background:#111827; color:#f9fafb; display:grid; place-items:center; min-height:100vh; margin:0 }
  main { text-align:center; max-width:520px; margin:1rem; }
  h1 { font-size:1.5rem; } p { line-height:1.9; color:#cbd5e1; }
  .dot { height:9px; width:9px; background:#60a5fa; border-radius:50%; margin:2rem auto; animation:pulse 1.5s infinite alternate; }
  @keyframes pulse { from {opacity:.25; transform:scale(.7)} to {opacity:1; transform:scale(1.4)} }
</style></head>
<body><main><h1>Paperclip — إدارة شركتك بوكلاء الذكاء الاصطناعي</h1><p>جارٍ تشغيل الخادم المحلي وتجهيز مساحة العمل…</p><div class="dot" aria-hidden="true"></div><p>في التشغيل الأول قد يحتاج إعداد قاعدة البيانات بعض الوقت.</p></main></body></html>
